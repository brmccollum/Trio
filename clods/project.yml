name: Clods
options:
  bundleIdPrefix: dev.clods
  deploymentTarget: { iOS: "17.0", watchOS: "10.0" }
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAMID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Clods:
    type: application
    platform: iOS
    sources:
      - src/ClodsApp.swift
      - src/Relay.swift
      - src/Store.swift
      - src/Views.swift
      - gen/ios/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clods.${TEAMID}
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: gen/ios/Info.plist
      properties:
        CFBundleDisplayName: Clods
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        ClodsKeychainGroup: $(AppIdentifierPrefix)dev.clods.shared
        CFBundleURLTypes:
          - CFBundleURLName: dev.clods.pair
            CFBundleURLSchemes: [clods]
    entitlements:
      path: gen/ios/Clods.entitlements
      properties:
        aps-environment: development
        keychain-access-groups: [$(AppIdentifierPrefix)dev.clods.shared]
    dependencies:
      - target: ClodsNSE
      - target: ClodsWatch
  ClodsNSE:
    type: app-extension
    platform: iOS
    sources:
      - src/NotificationService.swift
      - src/Relay.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clods.${TEAMID}.nse
    info:
      path: gen/nse/Info.plist
      properties:
        CFBundleDisplayName: Clods
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        ClodsKeychainGroup: $(AppIdentifierPrefix)dev.clods.shared
    entitlements:
      path: gen/nse/ClodsNSE.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.clods.shared]
  ClodsWatch:
    type: application
    platform: watchOS
    sources:
      - src/ClodsWatchApp.swift
      - src/Relay.swift
      - src/Store.swift
      - src/Views.swift
      - gen/watchos/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clods.${TEAMID}.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: gen/watch/Info.plist
      properties:
        CFBundleDisplayName: Clods
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.clods.${TEAMID}
